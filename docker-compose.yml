services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: laravel-app
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: bookfirst
            DB_USERNAME: admin
            DB_PASSWORD: admin
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    postgres:
        image: postgis/postgis:16-3.4
        container_name: bookfirst-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: bookfirst
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d bookfirst"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel

networks:
    laravel:

volumes:
    postgres_data:
        external: true
        name: bookfirst-postgres-data
